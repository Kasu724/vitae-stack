version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      development-tooling:
        dependency-type: development
        update-types: [minor, patch]
      production-patch:
        dependency-type: production
        update-types: [patch]
    labels: ["type:maintenance", "area:platform", "status:needs-triage"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["type:maintenance", "area:platform", "status:needs-triage"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels: ["type:maintenance", "area:platform", "status:needs-triage"]
