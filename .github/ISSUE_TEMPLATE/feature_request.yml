name: Feature request
description: Propose a scoped, evidence-based product or engineering improvement
title: "[Feature]: "
labels: ["type:feature", "status:needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and affected user
      description: Describe the unmet need without prescribing a solution.
    validations: { required: true }
  - type: textarea
    id: outcome
    attributes:
      label: Testable outcome
      description: Include acceptance behavior and how failure would be visible.
    validations: { required: true }
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope and explicit non-scope
    validations: { required: true }
  - type: textarea
    id: principles
    attributes:
      label: Evidence, privacy, security, and portability impact
      description: Explain data/provider changes and how unsupported claims remain blocked.
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: trace
    attributes:
      label: Related PR/AC/milestone/ADR IDs
      placeholder: "Example: PR-019, AC-016, M16, ADR-0010"
