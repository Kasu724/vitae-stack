name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - run: corepack enable && corepack prepare pnpm@11.9.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm test:contract
      - run: pnpm test:evals --smoke
      - run: pnpm test:parsers
      - run: pnpm test:security
      - run: pnpm test:ssrf
      - run: pnpm test:ats
      - run: pnpm test:exports
      - run: pnpm test:portability
      - run: pnpm test:deletion
      - run: pnpm test:performance
      - run: pnpm db:check
      - run: pnpm docs:check
      - run: pnpm notices:check
      - run: pnpm security:check
      - run: pnpm build

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - run: corepack enable && corepack prepare pnpm@11.9.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  windows-package:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - run: corepack enable; corepack prepare pnpm@11.9.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: ./scripts/personal/package.ps1
      - name: Verify extracted portable package
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist/*-windows-x64.zip | Select-Object -First 1
          $extract = Join-Path $env:RUNNER_TEMP "vitae-package"
          $data = Join-Path $env:RUNNER_TEMP "vitae-data"
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extract
          $bundle = (Get-ChildItem $extract -Directory | Select-Object -First 1).FullName
          $launcher = Join-Path $bundle "scripts/personal/vitae.ps1"
          $env:VITAE_DATA_DIR = $data
          try {
            Push-Location $bundle
            try {
              & $launcher Start -NoBrowser
            } finally {
              Pop-Location
            }
            $env:PLAYWRIGHT_BASE_URL = "http://127.0.0.1:3000"
            pnpm test:smoke
            if ($LASTEXITCODE) { throw "Package smoke failed" }
            pnpm test:personal
            if ($LASTEXITCODE) { throw "Package personal test failed" }
          } finally {
            & $launcher Stop
          }
