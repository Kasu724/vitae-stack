name: Release candidate

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Full release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require annotated version-matching tag
        run: |
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
          test -f "docs/releases/${GITHUB_REF_NAME#v}.md"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - run: corepack enable && corepack prepare pnpm@11.9.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm test:contract
      - run: pnpm test:evals --smoke
      - run: pnpm test:parsers
      - run: pnpm test:security
      - run: pnpm test:ssrf
      - run: pnpm test:ats
      - run: pnpm test:exports
      - run: pnpm test:portability
      - run: pnpm test:deletion
      - run: pnpm test:performance
      - run: pnpm db:check
      - run: pnpm docs:check
      - run: pnpm notices:check
      - run: pnpm security:check
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  windows-package:
    name: Windows portable package
    needs: quality
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - run: corepack enable; corepack prepare pnpm@11.9.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: ./scripts/personal/package.ps1
      - name: Verify extracted portable package
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist/*-windows-x64.zip | Select-Object -First 1
          $extract = Join-Path $env:RUNNER_TEMP "vitae-package"
          $data = Join-Path $env:RUNNER_TEMP "vitae-data"
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extract
          $bundle = (Get-ChildItem $extract -Directory | Select-Object -First 1).FullName
          $launcher = Join-Path $bundle "scripts/personal/vitae.ps1"
          $env:VITAE_DATA_DIR = $data
          try {
            Push-Location $bundle
            try {
              & $launcher Start -NoBrowser
            } finally {
              Pop-Location
            }
            $env:PLAYWRIGHT_BASE_URL = "http://127.0.0.1:3000"
            pnpm test:smoke
            if ($LASTEXITCODE) { throw "Package smoke failed" }
            pnpm test:personal
            if ($LASTEXITCODE) { throw "Package personal test failed" }
          } finally {
            & $launcher Stop
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          archive: false
          if-no-files-found: error
          retention-days: 14

  source:
    name: Source archive
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          mkdir dist
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="vitae-stack-$version/" --output="dist/vitae-stack-$version.tar.gz" "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source
          path: dist/*.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14

  publish-draft:
    name: Attest and create draft release
    needs: [windows-package, source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: (cd dist && sha256sum * >SHA256SUMS)
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Vitae Stack ${GITHUB_REF_NAME#v}" --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md" dist/*
