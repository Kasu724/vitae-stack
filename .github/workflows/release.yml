name: Release candidate

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Full release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require annotated version-matching tag
        run: |
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
          test -f "docs/releases/${GITHUB_REF_NAME#v}.md"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.17.0
      - run: npm install --global corepack@0.35.0
      - run: corepack enable && corepack prepare pnpm@11.9.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm test:contract
      - run: pnpm test:evals --smoke
      - run: pnpm test:parsers
      - run: pnpm test:security
      - run: pnpm test:ssrf
      - run: pnpm test:ats
      - run: pnpm test:exports
      - run: pnpm test:portability
      - run: pnpm test:deletion
      - run: pnpm test:performance
      - run: pnpm db:check
      - run: pnpm docs:check
      - run: pnpm notices:check
      - run: pnpm security:check
      - run: pnpm build
      - run: docker compose up --detach postgres
      - run: docker compose run --build --rm migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:a11y
      - run: docker compose up --build --detach --wait app parser job-fetcher deletion-worker
      - run: pnpm test:smoke
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      - name: Seed reference-size data
        run: pnpm db:seed:performance -- --confirm-synthetic-scale --email e2e-owner@example.test
      - name: Create access-restricted load-test cookie
        run: |
          curl --fail --silent --show-error \
            --cookie-jar cookie.jar \
            --header 'content-type: application/json' \
            --data '{"email":"e2e-owner@example.test","password":"synthetic-e2e-password-123"}' \
            http://127.0.0.1:3000/api/auth/sign-in/email >/dev/null
          sed 's/^#HttpOnly_//' cookie.jar | awk '$0 !~ /^#/ && NF >= 7 { if (seen++) printf "; "; printf "%s=%s", $6, $7 } END { print "" }' >cookie.header
          chmod 600 cookie.header
          test -s cookie.header
      - run: pnpm test:load
        env:
          LOAD_BASE_URL: http://127.0.0.1:3000
          LOAD_AUTH_COOKIE_FILE: cookie.header
      - if: always()
        run: rm -f cookie.jar cookie.header && docker compose down --volumes

  images:
    name: Image ${{ matrix.image }}
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            target: runtime
          - image: parser
            target: parser
          - image: job-fetcher
            target: job-fetcher
          - image: deletion-worker
            target: deletion-worker
          - image: tools
            target: build
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        name: Resolve immutable image name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.image }}:${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"
      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        id: metadata
        with:
          images: ${{ steps.names.outputs.image }}
          tags: type=raw,value=${{ github.ref_name }}
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        id: build
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.image }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ steps.names.outputs.image }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.names.outputs.image }}
          format: spdx-json
          output-file: vitae-stack-${{ matrix.image }}.spdx.json
          upload-artifact: false
      - name: Record immutable image reference
        run: echo "${{ steps.names.outputs.image }}@${{ steps.build.outputs.digest }}" >"vitae-stack-${{ matrix.image }}.image.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom-${{ matrix.image }}
          path: |
            vitae-stack-${{ matrix.image }}.spdx.json
            vitae-stack-${{ matrix.image }}.image.txt
          archive: false
          if-no-files-found: error
          retention-days: 14

  source:
    name: Reproducible source archive
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          mkdir dist
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="vitae-stack-$version/" --output="dist/vitae-stack-$version.tar.gz" "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source
          path: dist/*.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14

  publish-draft:
    name: Attest and create draft release
    needs: [images, source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: (cd dist && sha256sum * >SHA256SUMS)
      - uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/*
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Vitae Stack ${GITHUB_REF_NAME#v}" --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md" dist/*
