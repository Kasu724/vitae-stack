name: vitae-stack

services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: vitae
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-admin-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vitae"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend

  app:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      APP_BASE_URL: http://127.0.0.1:3000
      APP_BIND_HOST: 0.0.0.0
      DATABASE_URL: postgresql://vitae_app:vitae-app-dev-only@postgres:5432/vitae
      AUTH_MODE: password
      BETTER_AUTH_SECRET: compose-development-auth-secret-change-me
      BETTER_AUTH_URL: http://127.0.0.1:3000
      REGISTRATION_MODE: closed
      ARTIFACT_STORAGE_ROOT: /var/lib/vitae/artifacts
      PARSER_QUEUE_ROOT: /var/lib/vitae/parser-queue
      JOB_FETCH_QUEUE_ROOT: /var/lib/vitae/job-fetch-queue
      PARSER_MODE: sidecar
      JOB_FETCH_MODE: sidecar
      UPLOAD_MAX_BYTES: "10485760"
      PARSER_TIMEOUT_MS: "15000"
      PARSER_MAX_TEXT_CHARS: "500000"
      TELEMETRY_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - artifact-data:/var/lib/vitae/artifacts
      - parser-queue:/var/lib/vitae/parser-queue
      - job-fetch-queue:/var/lib/vitae/job-fetch-queue
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  parser:
    build:
      context: .
      target: parser
    environment:
      NODE_ENV: production
      ARTIFACT_STORAGE_ROOT: /var/lib/vitae/artifacts
      PARSER_QUEUE_ROOT: /var/lib/vitae/parser-queue
    network_mode: none
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 64
    ulimits:
      nofile:
        soft: 256
        hard: 256
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - artifact-data:/var/lib/vitae/artifacts:ro
      - parser-queue:/var/lib/vitae/parser-queue
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  job-fetcher:
    build:
      context: .
      target: job-fetcher
    environment:
      NODE_ENV: production
      JOB_FETCH_QUEUE_ROOT: /var/lib/vitae/job-fetch-queue
    network_mode: bridge
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    ulimits:
      nofile:
        soft: 256
        hard: 256
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - job-fetch-queue:/var/lib/vitae/job-fetch-queue
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  migrate:
    profiles: ["tools"]
    build:
      context: .
      target: build
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_MIGRATION_URL: postgresql://vitae_owner:vitae-owner-dev-only@postgres:5432/vitae
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  artifact-data:
  parser-queue:
  job-fetch-queue:
